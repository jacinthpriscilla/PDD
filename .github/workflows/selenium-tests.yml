name: Selenium E2E Web Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend-web/package-lock.json
          selenium-tests/package-lock.json

    - name: Install Backend dependencies & build
      run: |
        cd backend
        npm ci
        npm run build

    - name: Install Frontend dependencies
      run: |
        cd frontend-web
        npm ci

    - name: Install Selenium Tests dependencies
      run: |
        cd selenium-tests
        npm ci

    - name: Run Selenium E2E Web Tests & Generate Report
      run: |
        cd selenium-tests
        npm run test:e2e

    - name: Upload Excel QA Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test_suite_report
        path: test_suite_report.xlsx
