name: Vulnerability & Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          security-tests/package-lock.json

    - name: Install Backend dependencies & build
      run: |
        cd backend
        npm ci
        npm run build

    - name: Install Security Tests dependencies
      run: |
        cd security-tests
        npm ci

    - name: Run Vulnerability & Security Tests & Generate Report
      run: |
        cd security-tests
        npm run test:e2e

    - name: Upload Excel Security QA Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security_test_suite_report
        path: security_test_suite_report.xlsx
