name: Unified CI Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          selenium-tests/package-lock.json
          appium-tests/package-lock.json
          security-tests/package-lock.json
          validation-tests/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl

    - name: Install Backend dependencies & build
      run: |
        cd backend
        npm ci
        npm run build

    - name: Install Frontend dependencies
      run: |
        cd frontend-web
        npm ci

    - name: Install Selenium tests dependencies
      run: |
        cd selenium-tests
        npm ci

    - name: Install Appium tests dependencies
      run: |
        cd appium-tests
        npm ci

    - name: Install Security tests dependencies
      run: |
        cd security-tests
        npm ci

    - name: Install Validation tests dependencies
      run: |
        cd validation-tests
        npm ci

    - name: Start Backend Server
      run: |
        cd backend
        PORT=5001 DISABLE_RATE_LIMITER=true NODE_ENV=production node dist/backend/src/server.js &
      env:
        PORT: 5001
        DISABLE_RATE_LIMITER: 'true'
        NODE_ENV: 'production'

    - name: Start Frontend Server
      run: |
        cd frontend-web
        npx vite --port 3000 --strictPort &
      env:
        VITE_API_URL: 'http://localhost:5001/api'

    - name: Wait for services to be ready
      run: |
        echo "Waiting for backend on port 5001..."
        timeout 60s bash -c 'until curl -sf http://localhost:5001/api/health; do sleep 2; done'
        echo "Waiting for frontend on port 3000..."
        timeout 60s bash -c 'until curl -sf http://localhost:3000/; do sleep 2; done'

    - name: Run Selenium UI Tests
      run: |
        node selenium-tests/tests/run-selenium-300.js
      env:
        TEST_URL: 'http://localhost:3000/login'

    - name: Run Appium Mobile Tests
      run: |
        node appium-tests/tests/run-appium-300.js
      env:
        TEST_URL: 'http://localhost:5001'

    - name: Run Field Validation Tests
      run: |
        node validation-tests/tests/run-validation-300.js
      env:
        TEST_URL: 'http://localhost:5001'

    - name: Run Vulnerability & Security Tests
      run: |
        node security-tests/tests/run-security-300.js
      env:
        TEST_URL: 'http://localhost:5001'

    - name: Run Load & Performance Tests
      run: |
        node tests/run-load-300.js
      env:
        TEST_URL: 'http://localhost:5001'

    - name: Generate Excel & ZIP Reports
      if: always()
      run: |
        python tests/generate_reports.py

    - name: Upload Selenium Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-test-report
        path: selenium-report.zip

    - name: Upload Appium Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-test-report
        path: appium-report.zip

    - name: Upload Field Validation Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: field-validation-test-report
        path: field-validation-report.zip

    - name: Upload Vulnerability Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-test-report
        path: vulnerability-report.zip

    - name: Upload Load Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-report
        path: load-test-report.zip

    - name: Upload Master Test Reports Package
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-test-reports
        path: all-test-reports.zip
