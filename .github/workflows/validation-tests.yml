name: Form Field Validation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validation-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          validation-tests/package-lock.json

    - name: Install Backend dependencies & build
      run: |
        cd backend
        npm ci
        npm run build

    - name: Install Validation Tests dependencies
      run: |
        cd validation-tests
        npm install

    - name: Run Field Validation Tests & Generate Report
      run: |
        cd validation-tests
        npm run test:e2e

    - name: Upload Excel Validation QA Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation_test_suite_report
        path: validation_test_suite_report.xlsx
