name: Appium E2E Mobile Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: appium-tests/package-lock.json

    - name: Install Appium Tests dependencies
      run: |
        cd appium-tests
        npm ci

    - name: Run Appium E2E Mobile Tests & Generate Report
      run: |
        cd appium-tests
        npm run test:e2e

    - name: Upload Excel Mobile QA Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobile_test_suite_report
        path: mobile_test_suite_report.xlsx
